<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Reliable API delivery with Temporal Nexus: demo components</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#343a40"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1864ab"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/>
    </marker>
    <style>
      .h  { font-size: 15px; font-weight: 700; fill: #1b1f24; }
      .b  { font-size: 12.5px; fill: #1b1f24; }
      .s  { font-size: 11.5px; fill: #495057; }
      .k  { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: #495057; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1b1f24; }
      .lbl { font-size: 11.5px; fill: #343a40; }
      .lbl-b { font-size: 11.5px; fill: #1864ab; font-weight: 600; }
      .lbl-g { font-size: 11.5px; fill: #2b8a3e; font-weight: 600; }
      .caller { fill: #e7f0fb; stroke: #1864ab; stroke-width: 1.5; }
      .ns     { fill: #f3f0ff; stroke: #6741d9; stroke-width: 1.5; }
      .inner  { fill: #ffffff; stroke: #b197fc; stroke-width: 1; }
      .ep     { fill: #fff4e6; stroke: #e8590c; stroke-width: 1.5; }
      .svc    { fill: #f1f3f5; stroke: #495057; stroke-width: 1.5; }
      .req  { stroke: #343a40; stroke-width: 1.6; fill: none; }
      .sano { stroke: #1864ab; stroke-width: 2.2; fill: none; }
      .cb   { stroke: #2b8a3e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="#ffffff"/>

  <text x="40" y="42" class="h" style="font-size:20px">Reliable API delivery with Temporal Nexus: how the demo's parts talk</text>
  <text x="40" y="66" class="s" style="font-size:13px">Blue arrows start a Standalone Nexus Operation. Green dashed arrows carry results back. Callers only ever name an endpoint, a service, an operation and an ID.</text>

  <!-- column headings -->
  <text x="40" y="112" class="k">CALLERS · NO WORKFLOW NEEDED</text>
  <text x="1075" y="112" class="k">EXISTING SERVICES · NO TEMPORAL INSIDE</text>

  <!-- Temporal container -->
  <rect x="330" y="88" width="715" height="622" rx="14" fill="#f8f9fb" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="348" y="112" class="k">TEMPORAL · LOCAL DEV SERVER OR TEMPORAL CLOUD</text>

  <!-- Callers -->
  <rect x="40" y="235" width="260" height="70" rx="10" class="caller"/>
  <text x="56" y="261" class="h">Web UI · CI job · curl</text>
  <text x="56" y="283" class="s">anything that speaks plain HTTP</text>

  <rect x="40" y="345" width="260" height="104" rx="10" class="caller"/>
  <text x="56" y="371" class="h">HTTP gateway</text>
  <text x="56" y="391" class="m">POST /{endpoint}/{service}/{op}</text>
  <text x="56" y="411" class="s">result if done within N seconds,</text>
  <text x="56" y="427" class="s">else 202 + status URL to poll</text>
  <text x="56" y="443" class="s">routes only to cataloged operations</text>

  <rect x="40" y="485" width="260" height="76" rx="10" class="caller"/>
  <text x="56" y="511" class="h">Python service</text>
  <text x="56" y="531" class="s">Temporal SDK, start_operation()</text>
  <text x="56" y="549" class="s">typed by the generated contract</text>

  <line x1="170" y1="305" x2="170" y2="343" class="req" marker-end="url(#arrow)"/>
  <text x="178" y="329" class="lbl">HTTP</text>

  <!-- billing namespace (workflow caller) -->
  <rect x="360" y="128" width="240" height="78" rx="10" class="ns"/>
  <text x="376" y="152" class="h">billing namespace</text>
  <text x="376" y="173" class="b">FeeChangeWorkflow</text>
  <text x="376" y="193" class="s">a team's ordinary workflow</text>

  <!-- api-callers namespace -->
  <rect x="360" y="235" width="240" height="355" rx="10" class="ns"/>
  <text x="376" y="260" class="h">api-callers namespace</text>
  <text x="376" y="279" class="s">the caller namespace</text>
  <rect x="374" y="292" width="212" height="128" rx="8" class="inner"/>
  <text x="386" y="312" class="b" style="font-weight:600">Standalone Nexus Operations</text>
  <text x="386" y="332" class="m">notify-T-42-1   COMPLETED</text>
  <text x="386" y="350" class="m">release-10-05   STARTED</text>
  <text x="386" y="368" class="m">send-typo-81c0  FAILED</text>
  <text x="386" y="392" class="s">one durable record per call</text>
  <text x="386" y="408" class="s">ID = business key</text>
  <text x="376" y="446" class="s">Temporal owns, per record:</text>
  <text x="376" y="464" class="s">· retries of the start</text>
  <text x="376" y="480" class="s">· dedupe by operation ID</text>
  <text x="376" y="496" class="s">· status, history, result by ID</text>
  <text x="376" y="512" class="s">· list / describe / terminate</text>

  <line x1="300" y1="397" x2="358" y2="397" class="sano" marker-end="url(#arrow-blue)"/>
  <text x="306" y="389" class="lbl-b">start</text>
  <line x1="300" y1="523" x2="358" y2="523" class="sano" marker-end="url(#arrow-blue)"/>
  <text x="306" y="515" class="lbl-b">start</text>

  <!-- Endpoints -->
  <rect x="622" y="240" width="156" height="320" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="700" y="260" class="k" text-anchor="middle">NEXUS ENDPOINTS</text>
  <text x="700" y="276" class="s" text-anchor="middle">allowlist of callers</text>
  <rect x="630" y="290" width="140" height="32" rx="16" class="ep"/>
  <text x="700" y="310" class="m" text-anchor="middle" style="font-size:11.5px">notifications-dev</text>
  <text x="700" y="339" class="s" text-anchor="middle">→ notifications</text>
  <rect x="630" y="492" width="140" height="32" rx="16" class="ep"/>
  <text x="700" y="512" class="m" text-anchor="middle" style="font-size:11.5px">task-center-dev</text>
  <text x="700" y="541" class="s" text-anchor="middle">→ task-center</text>

  <line x1="600" y1="306" x2="628" y2="306" class="sano" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="508" x2="628" y2="508" class="sano" marker-end="url(#arrow-blue)"/>
  <line x1="770" y1="306" x2="788" y2="306" class="req" marker-end="url(#arrow)"/>
  <line x1="770" y1="508" x2="788" y2="508" class="req" marker-end="url(#arrow)"/>

  <!-- billing calls both endpoints from its workflow -->
  <path d="M600,167 L700,167 L700,238" class="req" marker-end="url(#arrow)"/>
  <text x="612" y="158" class="lbl">Nexus from a workflow (both endpoints)</text>

  <!-- notifications namespace -->
  <rect x="790" y="235" width="235" height="182" rx="10" class="ns"/>
  <text x="806" y="259" class="h">notifications namespace</text>
  <text x="806" y="277" class="s">worker generated from the API's spec</text>
  <rect x="802" y="287" width="211" height="38" rx="6" class="inner"/>
  <text x="812" y="303" class="b">Nexus handler · generated</text>
  <text x="812" y="318" class="s">notifications.v1 / send</text>
  <rect x="802" y="331" width="211" height="26" rx="6" class="inner"/>
  <text x="812" y="349" class="b">workflow · generated</text>
  <rect x="802" y="363" width="211" height="42" rx="6" class="inner"/>
  <text x="812" y="380" class="b">activity · generated</text>
  <text x="812" y="396" class="s">shared runtime: 5xx retries, 4xx fails</text>

  <!-- task-center namespace -->
  <rect x="790" y="437" width="235" height="238" rx="10" class="ns"/>
  <text x="806" y="461" class="h">task-center namespace</text>
  <text x="806" y="479" class="s">Task Center team's worker</text>
  <rect x="802" y="489" width="211" height="38" rx="6" class="inner"/>
  <text x="812" y="505" class="b">Nexus handler</text>
  <text x="812" y="520" class="s">task-center.v1 / request_input</text>
  <rect x="802" y="533" width="211" height="42" rx="6" class="inner"/>
  <text x="812" y="550" class="b">HumanInputWorkflow</text>
  <text x="812" y="566" class="s">waits for a person, or a deadline</text>
  <rect x="802" y="581" width="211" height="26" rx="6" class="inner"/>
  <text x="812" y="598" class="b">create_task · expire_task</text>
  <text x="806" y="628" class="s">signals arrive here, from Task Center</text>
  <text x="806" y="644" class="s">only: no access to the caller's</text>
  <text x="806" y="660" class="s">namespace needed</text>

  <!-- results called back -->
  <line x1="788" y1="400" x2="602" y2="400" class="cb" marker-end="url(#arrow-green)"/>
  <text x="634" y="394" class="lbl-g">result</text>
  <line x1="788" y1="575" x2="602" y2="575" class="cb" marker-end="url(#arrow-green)"/>
  <text x="634" y="590" class="lbl-g">result</text>

  <!-- Existing services -->
  <rect x="1075" y="235" width="290" height="182" rx="10" class="svc"/>
  <text x="1091" y="261" class="h">Notification API</text>
  <text x="1091" y="285" class="b">POST /v1/notifications</text>
  <text x="1091" y="309" class="s">requires an API key, which only the</text>
  <text x="1091" y="325" class="s">Notification team's worker holds</text>
  <text x="1091" y="349" class="s">honors Idempotency-Key: never sends twice</text>
  <text x="1091" y="373" class="s">its OpenAPI spec generates the contract</text>
  <text x="1091" y="389" class="s">and the whole handler (x-nexus routes)</text>

  <rect x="1075" y="437" width="290" height="238" rx="10" class="svc"/>
  <text x="1091" y="463" class="h">Task Center service</text>
  <text x="1091" y="487" class="b">system of record for tasks</text>
  <text x="1091" y="511" class="s">people approve, reject or reassign here</text>
  <text x="1091" y="539" class="s">on an answer: signals the waiting</text>
  <text x="1091" y="555" class="s">workflow in its own namespace</text>
  <text x="1091" y="583" class="s">on create or reassign: starts a</text>
  <text x="1091" y="599" class="s">notification operation and moves on</text>

  <line x1="1025" y1="384" x2="1073" y2="384" class="req" marker-end="url(#arrow)"/>
  <text x="1031" y="376" class="lbl">HTTPS</text>
  <line x1="1073" y1="552" x2="1027" y2="552" class="req" marker-end="url(#arrow)"/>
  <text x="1031" y="544" class="lbl">signal</text>
  <line x1="1025" y1="594" x2="1073" y2="594" class="req" marker-end="url(#arrow)"/>
  <text x="1031" y="588" class="lbl">create</text>

  <!-- Task Center starts notification operations (standalone) -->
  <path d="M1220,675 L1220,745 L480,745 L480,592" class="sano" marker-end="url(#arrow-blue)"/>
  <text x="850" y="766" class="lbl-b" text-anchor="middle">Task Center starts a standalone notification operation for each task event, then moves on</text>

  <!-- legend -->
  <g transform="translate(40,808)">
    <line x1="0" y1="0" x2="40" y2="0" class="sano" marker-end="url(#arrow-blue)"/>
    <text x="50" y="4" class="s">starts a Standalone Nexus Operation</text>
    <line x1="290" y1="0" x2="330" y2="0" class="req" marker-end="url(#arrow)"/>
    <text x="340" y="4" class="s">request, routing, activity call or signal</text>
    <line x1="600" y1="0" x2="640" y2="0" class="cb" marker-end="url(#arrow-green)"/>
    <text x="650" y="4" class="s">result called back to the operation</text>
    <rect x="880" y="-9" width="18" height="18" rx="4" class="caller"/><text x="905" y="4" class="s">caller</text>
    <rect x="960" y="-9" width="18" height="18" rx="4" class="ns"/><text x="985" y="4" class="s">Temporal namespace</text>
    <rect x="1115" y="-9" width="18" height="18" rx="4" class="ep"/><text x="1140" y="4" class="s">endpoint</text>
    <rect x="1205" y="-9" width="18" height="18" rx="4" class="svc"/><text x="1230" y="4" class="s">existing service</text>
  </g>
</svg>
